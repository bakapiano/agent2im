interface:
  display_name: "Connect to IM"
  short_description: "Register Codex sessions and message users over IM"
  default_prompt: "Use $connect-to-im to register this existing Codex session with my Web-approved IM connection."

dependencies:
  tools:
    - type: "mcp"
      value: "agent-to-im"
      description: "Register the current session, send a message, and wait for its user's reply."

policy:
  allow_implicit_invocation: true
