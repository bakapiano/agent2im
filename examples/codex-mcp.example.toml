# Source-development MCP entry. The distributed Codex Plugin bundles this setup.
# First tool use initializes the OS-protected local client and starts the Broker.
[mcp_servers.agent-to-im]
command = "D:/agent-to-IM/.tools/node-v24.21.0-win-x64/node.exe"
args = ["D:/agent-to-IM/dist/cli.js", "mcp"]
env_vars = ["CODEX_HOME"]
startup_timeout_sec = 15
tool_timeout_sec = 360
required = false
enabled_tools = ["register", "send_message_to_user", "wait_for_user_message", "configure_im_channel"]

# Per-call host metadata selects the current runtime. IM grants govern its recipient.
# Default user data is outside the plugin cache in LOCALAPPDATA/agent-to-im.
